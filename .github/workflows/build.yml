name: Build SFS Mod Manager Core

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build src/SFSModManager.Core/SFSModManager.Core.csproj -c Release
      - name: Assemble ZIP
        run: |
          mkdir -p package/SFS-Mod-Manager
          cp README.md package/SFS-Mod-Manager/
          cp src/SFSModManager.Core/bin/Release/netstandard2.0/SFSModManager.Core.dll package/SFS-Mod-Manager/
          cd package
          zip -r ../SFS-Mod-Manager-core.zip SFS-Mod-Manager
      - uses: actions/upload-artifact@v4
        with:
          name: SFS-Mod-Manager-core
          path: SFS-Mod-Manager-core.zip
          if-no-files-found: error
